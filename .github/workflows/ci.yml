name: CI

on:
  push:
    branches:
      - main
      - new-arch
  pull_request:
    branches:
      - main
      - new-arch

permissions:
  contents: read

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Race tests (critical packages)
        run: go test -race ./pkg/idgen/... ./pkg/dbrouter/... ./pkg/telemetry/...

      - name: Vulnerability check
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.27.x'
          go-package: ./...
