name: CI

on:
  push:
    branches:
      - master
      - main
      - new-arch
  pull_request:
    branches:
      - master
      - main
      - new-arch

permissions:
  contents: read

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          # Do not restore the shared Go build/module cache: a stale GitHub
          # cache archive makes tar fail with "Cannot open: File exists".
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests (with coverage)
        run: go test -cover ./...

      - name: Race tests (critical packages)
        run: go test -race ./pkg/idgen/... ./pkg/dbrouter/... ./pkg/telemetry/...

      # Run govulncheck directly instead of golang/govulncheck-action: the action
      # restores its own tar cache, which emits "Cannot open: File exists" and
      # "tar failed to restore" annotations when the cache archive is stale.
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
