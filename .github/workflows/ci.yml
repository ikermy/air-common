name: CI

on:
  push:
    branches:
      - main
      - new-arch
  pull_request:
    branches:
      - main
      - new-arch

permissions:
  contents: read

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          # Do not restore the shared Go build/module cache: a stale GitHub
          # cache archive makes tar fail with "Cannot open: File exists".
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests (with coverage)
        run: go test -cover ./...

      - name: Race tests (critical packages)
        run: go test -race ./pkg/idgen/... ./pkg/dbrouter/... ./pkg/telemetry/...

      - name: Vulnerability check
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.27.x'
          go-package: ./...
